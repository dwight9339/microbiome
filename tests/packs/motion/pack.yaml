# Test pack for motion (tests/motion_test.c). The 32x16 background has a
# different colour in every column, so a shifted pixel shows which column it
# came from. The mask covers x 8-23, y 4-11: full weight at x 8-15, half at
# x 16-23. With amp 2, wavelength 8 and period 1s, at t = 0 row 4 is still,
# row 6 shifts right by 2 (half weight: 1) and row 10 left by 2 (1); 250 ms
# later row 4 shifts left. The PNGs are generated by make_art.py.
name: Motion test

world:
  size: [32, 16]
  camera: {start: [16, 8], idle_drift: 0}

layers:
  - {name: bg, image: art/bg.png}

motion:
  water: {layer: bg, mask: art/water.png, amp: 2, period: 1s, wavelength: 8}
