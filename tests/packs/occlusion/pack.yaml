# Test pack for occlusion (tests/occlusion_test.c). Three 4x4 actors stand
# still at fixed places around one occluder, a red box at x 20-43, y 10-29
# with its base at y 30:
#   back  (blue,   lane ground) feet (20, 25): behind it, straddling its left
#         edge, so only its two columns inside the box are hidden;
#   front (white,  lane ground) feet (32, 30): feet on the base = in front;
#   air   (yellow, lane air)    feet (40, 25): behind by y, but the occluder
#         only applies to the ground lane.
# The PNGs are generated by make_art.py.
name: Occlusion test

world:
  size: [64, 40]
  camera: {start: [32, 20], idle_drift: 0}
  spawning: {interval: 1s, chance: 100, max_actors: 8}

layers:
  - {name: bg, image: art/bg.png}

lanes:
  ground: [5, 35]
  air:    [5, 35]

places:
  back_spot:  {at: [20, 25], offers: [back]}
  front_spot: {at: [32, 30], offers: [front]}
  air_spot:   {at: [40, 25], offers: [air]}

occlusion:
  mask: art/occlusion.png
  occluders:
    box: {color: "#ff0000", base: 30, lanes: [ground]}

actors:
  back:  &still
    sheet: art/blue.png
    frame: [4, 4]
    anchor: [2, 3]
    lane: ground
    anims: {idle: {frames: [0], fps: 1}}
    states: {stay: {anim: idle, duration: [1h, 1h], next: stay}}
  front: {<<: *still, sheet: art/white.png}
  air:   {<<: *still, sheet: art/yellow.png, lane: air}

spawns:
  - {actor: back,  enter: place back}
  - {actor: front, enter: place front}
  - {actor: air,   enter: place air}
